<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>echo</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262a33; --fg:#e6e6e6; --dim:#8a8f9a; --cyan:#5ed3f3; --green:#7ddc8a; --yellow:#e7c46a; --star:#f2c14e; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); flex:none; -webkit-app-region:drag; }
  header b { font-size:13px; letter-spacing:.5px; }
  header .sp { flex:1; }
  .btn { background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:3px 9px; cursor:pointer; font-size:12px; -webkit-app-region:no-drag; }
  .btn.on { color:var(--cyan); border-color:#2e5b6b; }
  .btn.ghost { color:var(--dim); }
  main { flex:1; overflow:auto; padding:10px; }
  .now { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .line { display:flex; gap:8px; align-items:flex-start; margin:4px 0; }
  .line .k { flex:none; font-weight:600; font-size:12px; margin-top:2px; }
  .k.you { color:var(--cyan); } .k.short { color:var(--green); } .k.better { color:var(--yellow); }
  .en { flex:1; font-size:15px; }
  .en .w { cursor:pointer; border-radius:4px; padding:0 1px; }
  .en .w:hover { background:#2b3140; }
  .en .w.fav { color:var(--star); text-decoration:underline dotted; }
  .zh { color:var(--dim); font-size:12px; margin-top:6px; }
  .star { flex:none; cursor:pointer; color:var(--dim); font-size:15px; line-height:1; margin-top:2px; user-select:none; }
  .star.on { color:var(--star); }
  h2 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:14px 0 6px; }
  .item { border-top:1px solid var(--line); padding:8px 2px; }
  .item .line { margin:2px 0; }
  .item .en { font-size:14px; }
  .favs .f { display:flex; gap:8px; align-items:baseline; padding:4px 2px; border-top:1px solid var(--line); }
  .favs .f b { color:var(--star); font-weight:600; }
  .favs .f .ctx { color:var(--dim); font-size:12px; flex:1; }
  .favs .f .x { color:var(--dim); cursor:pointer; }
  .pending { color:var(--dim); }
  .empty { color:var(--dim); text-align:center; padding:30px 0; }
  .tabs { display:flex; gap:6px; margin-top:6px; }
  .setup .row { display:flex; gap:10px; align-items:flex-start; padding:8px 2px; border-top:1px solid var(--line); }
  .setup .row .t { flex:1; }
  .setup .row .t small { display:block; color:var(--dim); font-size:11px; margin-top:2px; }
  .setup .row .t code { font-size:11px; color:var(--dim); }
  .setup .off { opacity:.55; }
  .setup label { display:block; font-size:12px; color:var(--dim); margin:8px 0 3px; }
  .setup input, .setup select { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:6px 8px; font:inherit; font-size:13px; }
  .setup .actions { display:flex; gap:8px; margin-top:10px; align-items:center; }
  .setup .result { font-size:12px; color:var(--dim); margin-top:6px; white-space:pre-wrap; }
  .setup .result.ok { color:var(--green); } .setup .result.err { color:#e07a7a; }
  .badge { font-size:11px; padding:1px 6px; border-radius:5px; border:1px solid var(--line); color:var(--dim); }
  .badge.on { color:var(--green); border-color:#2f5a3a; }
</style>
</head>
<body>
<header>
  <b>echo</b>
  <span id="status" style="color:var(--dim);font-size:12px">…</span>
  <span class="sp"></span>
  <button class="btn" id="lvl" title="0：中文写，看 You said；1：试着用英文写，看 Better">Lv 0</button>
  <button class="btn" id="pip" title="弹成常驻置顶小窗（Chrome/Edge）">置顶</button>
  <button class="btn ghost" id="close" title="关闭" onclick="window.close()">×</button>
</header>
<main id="main">
  <div class="now" id="now"><div class="empty">等你和 agent 说第一句话</div></div>
  <div class="tabs">
    <button class="btn on" data-tab="today">今天</button>
    <button class="btn" data-tab="favs">收藏 <span id="favcount"></span></button>
    <button class="btn" data-tab="setup">设置</button>
  </div>
  <section id="today"></section>
  <section id="favs" class="favs" hidden></section>
  <section id="setup" class="setup" hidden></section>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const api = (m, p, b) => fetch(p, { method: m, headers: { "content-type": "application/json" }, body: b ? JSON.stringify(b) : undefined }).then((r) => r.json());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let favs = [], favWords = new Set(), favSentences = new Set(), level = 0;

// Every English word is clickable → star it (saved with the sentence it came from).
function words(en) {
  return String(en ?? "").split(/(\s+)/).map((tok) => {
    if (!tok.trim()) return tok;
    const core = tok.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, "");
    if (!core) return esc(tok);
    const on = favWords.has(core.toLowerCase()) ? " fav" : "";
    return tok.replace(core, `<span class="w${on}" data-w="${esc(core)}">${esc(core)}</span>`);
  }).join("");
}
function line(kind, en, status) {
  const label = kind === "better" ? "Better" : kind === "inShort" ? "In short" : "You said";
  const cls = kind === "better" ? "better" : kind === "inShort" ? "short" : "you";
  if (status && status !== "done") return `<div class="line"><span class="k ${cls}">▸ ${label}</span><span class="en pending">${status === "pending" ? "…" : "(unavailable)"}</span></div>`;
  const on = favSentences.has(en) ? " on" : "";
  return `<div class="line" data-s="${esc(en)}"><span class="k ${cls}">▸ ${label}</span><span class="en">${words(en)}</span><span class="star${on}" title="收藏这句">★</span></div>`;
}

let turns = [];
function render() {
  const now = $("#now");
  const u = [...turns].reverse().find((t) => t.role === "user");
  const a = [...turns].reverse().find((t) => t.role === "agent");
  if (!u && !a) { now.innerHTML = `<div class="empty">等你和 agent 说第一句话</div>`; }
  else {
    const aFresh = a && (!u || a.ts >= u.ts);
    now.innerHTML = (u ? line(u.kind || "youSaid", u.en, u.status) : "") + (aFresh ? line("inShort", a.en, a.status) : "") + (u ? `<div class="zh">${esc(u.text.slice(0, 140))}</div>` : "");
  }
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const todays = turns.filter((t) => new Date(t.ts) >= start && t.status === "done").reverse();
  $("#today").innerHTML = `<h2>今天 · ${todays.length} 条</h2>` + (todays.length ? todays.map((t) => `<div class="item">${line(t.role === "agent" ? "inShort" : (t.kind || "youSaid"), t.en, t.status)}<div class="zh">${esc(t.text.slice(0, 100))}</div></div>`).join("") : `<div class="empty">今天还没有</div>`);
  $("#favcount").textContent = favs.length ? favs.length : "";
  $("#favs").innerHTML = `<h2>收藏 · ${favs.length}</h2>` + (favs.length ? favs.map((f) => `<div class="f" data-kind="${f.kind}" data-text="${esc(f.text)}"><b>${esc(f.text)}</b><span class="ctx">${f.kind === "word" ? esc(f.context) : ""}</span><span class="x" title="取消收藏">×</span></div>`).join("") : `<div class="empty">点英文里的任何一个词，或句尾的 ★</div>`);
  $("#lvl").textContent = `Lv ${level}`; $("#lvl").classList.toggle("on", level === 1);
}

async function loadState() { try { const h = await api("GET", "health"); $("#status").textContent = h.model; } catch { $("#status").textContent = "core 不可用"; } }
async function load() {
  const [r, f, s] = await Promise.all([api("GET", "recent?n=50"), api("GET", "favorites"), api("GET", "state")]);
  turns = r.turns.reverse(); setFavs(f.favorites); level = s.level || 0; render();
  loadState();
}
function setFavs(list) { favs = list; favWords = new Set(list.filter((f) => f.kind === "word").map((f) => f.key)); favSentences = new Set(list.filter((f) => f.kind === "sentence").map((f) => f.text)); }

document.addEventListener("click", async (e) => {
  const w = e.target.closest(".w");
  if (w) { const ctx = w.closest(".line")?.dataset.s || ""; const r = await api("POST", "favorites/toggle", { kind: "word", text: w.dataset.w, context: ctx }); setFavs(r.favorites); render(); return; }
  const st = e.target.closest(".star");
  if (st) { const r = await api("POST", "favorites/toggle", { kind: "sentence", text: st.closest(".line").dataset.s }); setFavs(r.favorites); render(); return; }
  const x = e.target.closest(".favs .x");
  if (x) { const f = x.closest(".f"); const r = await api("POST", "favorites/toggle", { kind: f.dataset.kind, text: f.dataset.text }); setFavs(r.favorites); render(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) { document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b === tab)); for (const id of ["today", "favs", "setup"]) $("#" + id).hidden = tab.dataset.tab !== id; if (tab.dataset.tab === "setup") loadSetup(); }
  const hz = e.target.closest("[data-harness]");
  if (hz) { hz.disabled = true; await api("POST", "setup/harness", { id: hz.dataset.harness, enabled: hz.dataset.enabled !== "1" }); loadSetup(); return; }
});

// ---- settings: harnesses + model backend ----
let setup = null;
function backendForm() {
  const b = setup.backend, opt = setup.backendOptions.find((o) => o.id === b.type) || setup.backendOptions[0];
  const f = (name, label, value, type = "text", ph = "") => `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value ?? "")}" placeholder="${esc(ph)}">`;
  let fields = "";
  if (opt.fields.includes("model")) fields += f("model", "模型", b.type === opt.id ? b.model : opt.defaults.model, "text", opt.defaults.model || "留空用默认");
  if (opt.fields.includes("baseUrl")) fields += f("baseUrl", "Base URL", b.type === opt.id ? b.baseUrl : opt.defaults.baseUrl);
  if (opt.fields.includes("apiKey")) fields += f("apiKey", "API Key（只存在本机 ~/.echo/config.json，600 权限）", b.type === opt.id ? b.apiKey : "", "password");
  if (opt.fields.includes("name")) fields += f("name", "模型名", b.type === opt.id ? b.name : opt.defaults.name);
  if (opt.fields.includes("extra")) fields += f("extra", "额外请求参数 JSON（留空按端点自动关思考）", b.type === opt.id ? (typeof b.extra === "string" ? b.extra : JSON.stringify(b.extra || {})) : "", "text", '{"thinking":{"type":"disabled"}}');
  return `<label>翻译 / 概括用哪个模型</label>
    <select name="type">${setup.backendOptions.map((o) => `<option value="${o.id}" ${o.id === opt.id ? "selected" : ""} ${o.present ? "" : "disabled"}>${esc(o.label)}${o.present ? "" : "（本机未检测到）"}</option>`).join("")}</select>
    ${opt.note ? `<small style="color:var(--dim)">${esc(opt.note)}</small>` : ""}
    ${fields}
    <div class="actions"><button class="btn" id="bk-test">测试</button><button class="btn on" id="bk-save">保存并启用</button><span class="badge ${setup.fromConfig ? "on" : ""}">${setup.fromConfig ? "来自设置" : "来自环境变量/默认"}</span></div>
    <div class="result" id="bk-result"></div>`;
}
function renderSetup() {
  if (!setup) return;
  $("#setup").innerHTML = `<h2>接入的 harness</h2>` + setup.harnesses.map((h) => `
    <div class="row ${h.present ? "" : "off"}"><div class="t">${esc(h.label)} <span class="badge ${h.enabled ? "on" : ""}">${h.enabled ? "已接入" : h.present ? "未接入" : "未检测到"}</span>
      <small>${esc(h.display)}${h.note ? " · " + esc(h.note) : ""}</small><code>${esc(h.file)}</code></div>
      <button class="btn ${h.enabled ? "" : "on"}" data-harness="${h.id}" data-enabled="${h.enabled ? 1 : 0}" ${h.present || h.enabled ? "" : "disabled"}>${h.enabled ? "移除" : "接入"}</button></div>`).join("")
    + `<h2 style="margin-top:18px">模型</h2><div id="bk">${backendForm()}</div>
    <small style="display:block;color:var(--dim);margin-top:14px">配置作用于运行 echo core 的这台机器（${esc(setup.home)}，${esc(setup.platform)}）。harness 配置文件改动前会留一份 .echo-bak。</small>`;
}
async function loadSetup() { setup = await api("GET", "setup"); renderSetup(); }
function readForm() {
  const form = $("#bk"); const b = { type: form.querySelector('[name=type]').value };
  for (const inp of form.querySelectorAll("input")) b[inp.name] = inp.value;
  return b;
}
document.addEventListener("change", (e) => { if (e.target.name === "type" && setup) { setup.backend = { ...setup.backend, type: e.target.value }; $("#bk").innerHTML = backendForm(); } });
document.addEventListener("click", async (e) => {
  if (e.target.id === "bk-test") { const r = $("#bk-result"); r.textContent = "测试中…"; r.className = "result"; const out = await api("POST", "setup/backend", { backend: readForm(), test: true }); r.textContent = out.ok ? `${out.ms} ms · ${out.en}` : `失败（${out.ms} ms）：${out.error}`; r.className = "result " + (out.ok ? "ok" : "err"); }
  if (e.target.id === "bk-save") { const r = $("#bk-result"); const out = await api("POST", "setup/backend", { backend: readForm() }); r.textContent = out.error ? out.error : "已保存，下一轮起生效"; r.className = "result " + (out.error ? "err" : "ok"); loadSetup(); loadState(); }
});
$("#lvl").addEventListener("click", async () => { const s = await api("POST", "state", { level: level ? 0 : 1 }); level = s.level; render(); });

// Always-on-top: Chrome/Edge Document Picture-in-Picture (a real always-on-top window). Fallback: small popup.
$("#pip").addEventListener("click", async () => {
  if ("documentPictureInPicture" in window) {
    const pip = await documentPictureInPicture.requestWindow({ width: 420, height: 360 });
    for (const s of document.querySelectorAll("style")) pip.document.head.appendChild(s.cloneNode(true));
    pip.document.body.append(...document.body.childNodes);
    pip.document.getElementById("pip")?.remove();
    pip.addEventListener("pagehide", () => location.reload());
  } else {
    window.open(location.href, "echo-card", "popup,width=420,height=360");
  }
});

// Live updates.
function connect() {
  const es = new EventSource("events");
  es.addEventListener("turn", (e) => { const { turn } = JSON.parse(e.data); const i = turns.findIndex((t) => t.id === turn.id); if (i >= 0) turns[i] = turn; else turns.push(turn); render(); });
  es.onerror = () => { es.close(); $("#status").textContent = "重连中…"; setTimeout(connect, 2000); };
  es.onopen = () => { loadState(); };
}
load(); connect();
</script>
</body>
</html>
