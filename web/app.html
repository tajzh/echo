<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#262a33; --fg:#e6e6e6; --dim:#8a8f9a; --cyan:#5ed3f3; --green:#7ddc8a; --yellow:#e7c46a; --red:#e07a7a; --star:#f2c14e; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; display:flex; flex-direction:column; -webkit-user-select:none; user-select:none; }
  header { display:flex; align-items:center; gap:8px; padding:10px 12px 6px; flex:none; -webkit-app-region:drag; }
  header b { font-size:14px; letter-spacing:.5px; }
  body.mac header { padding-left:78px; } /* room for the traffic lights under the hidden title bar */
  header .dot { width:7px; height:7px; border-radius:50%; background:var(--dim); }
  header .dot.ok { background:var(--green); } header .dot.off { background:var(--yellow); } header .dot.err { background:var(--red); }
  header .st { color:var(--dim); font-size:12px; }
  header .sp { flex:1; }
  .btn { background:var(--panel); border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:3px 9px; cursor:pointer; font:inherit; font-size:12px; -webkit-app-region:no-drag; }
  .btn:hover { background:var(--panel2); } .btn:disabled { opacity:.5; cursor:default; }
  .btn.on { color:var(--cyan); border-color:#2e5b6b; }
  .btn.pri { background:#1f4b5a; border-color:#2e6b7e; color:#dff6ff; }
  .btn.ghost { color:var(--dim); }
  nav { display:flex; gap:2px; padding:0 8px; border-bottom:1px solid var(--line); flex:none; -webkit-app-region:drag; }
  nav button { background:none; border:0; border-bottom:2px solid transparent; color:var(--dim); padding:6px 10px; cursor:pointer; font:inherit; font-size:13px; -webkit-app-region:no-drag; }
  nav button.on { color:var(--fg); border-bottom-color:var(--cyan); }
  nav button .n { color:var(--dim); font-size:11px; margin-left:3px; }
  nav button .warn { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--yellow); margin-left:4px; vertical-align:middle; }
  main { flex:1; overflow:auto; padding:10px 12px 16px; -webkit-user-select:text; user-select:text; }
  section[hidden] { display:none; }
  .now { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px; }
  .line { display:flex; gap:8px; align-items:flex-start; margin:4px 0; }
  .line .k { flex:none; font-weight:600; font-size:12px; margin-top:2px; }
  .k.you { color:var(--cyan); } .k.short { color:var(--green); } .k.better { color:var(--yellow); }
  .en { flex:1; font-size:15px; }
  .en .w { cursor:pointer; border-radius:4px; padding:0 1px; }
  .en .w:hover { background:#2b3140; }
  .en .w.fav { color:var(--star); text-decoration:underline dotted; }
  .zh { color:var(--dim); font-size:12px; margin-top:6px; }
  .meta { color:var(--dim); font-size:11px; margin-top:4px; }
  .star { flex:none; cursor:pointer; color:var(--dim); font-size:15px; line-height:1; margin-top:2px; }
  .star.on { color:var(--star); }
  h2 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:14px 0 6px; }
  .item { border-top:1px solid var(--line); padding:8px 2px; }
  .item .line { margin:2px 0; } .item .en { font-size:14px; }
  .favs .f { display:flex; gap:8px; align-items:baseline; padding:5px 2px; border-top:1px solid var(--line); }
  .favs .f b { color:var(--star); font-weight:600; }
  .favs .f .ctx { color:var(--dim); font-size:12px; flex:1; }
  .favs .f .x { color:var(--dim); cursor:pointer; }
  .pending { color:var(--dim); }
  .empty { color:var(--dim); text-align:center; padding:26px 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .card.off { opacity:.6; }
  .card .hd { display:flex; gap:10px; align-items:center; }
  .card .hd .t { flex:1; }
  .card .hd .t small { display:block; color:var(--dim); font-size:11px; }
  .card .body { color:var(--dim); font-size:12px; margin-top:6px; }
  .card .body code { font-size:11px; word-break:break-all; }
  .card .after { margin-top:8px; padding:8px 10px; background:var(--panel2); border-radius:8px; color:var(--fg); font-size:12px; }
  .card pre { margin:6px 0 0; padding:8px; background:var(--bg); border-radius:8px; font-size:11px; overflow:auto; max-height:200px; color:var(--dim); -webkit-user-select:text; user-select:text; }
  .badge { font-size:11px; padding:1px 7px; border-radius:6px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .badge.on { color:var(--green); border-color:#2f5a3a; }
  .badge.warn { color:var(--yellow); border-color:#5a4d2a; }
  label { display:block; font-size:12px; color:var(--dim); margin:8px 0 3px; }
  input, select { width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:7px; padding:6px 8px; font:inherit; font-size:13px; -webkit-user-select:text; user-select:text; }
  .actions { display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap; }
  .result { font-size:12px; color:var(--dim); margin-top:6px; white-space:pre-wrap; }
  .result.ok { color:var(--green); } .result.err { color:var(--red); }
  .opt { display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:10px; margin-bottom:6px; cursor:pointer; }
  .opt.sel { border-color:#2e6b7e; background:var(--panel); }
  .opt.dis { opacity:.45; cursor:default; }
  .opt .t { flex:1; } .opt .t small { display:block; color:var(--dim); font-size:11px; }
  .opt .r { width:12px; height:12px; border-radius:50%; border:2px solid var(--dim); flex:none; }
  .opt.sel .r { border-color:var(--cyan); background:var(--cyan); }
  .row { display:flex; gap:10px; align-items:center; padding:9px 2px; border-top:1px solid var(--line); }
  .row .t { flex:1; } .row .t small { display:block; color:var(--dim); font-size:11px; }
  .sw { width:34px; height:20px; border-radius:10px; background:var(--line); position:relative; cursor:pointer; flex:none; border:0; padding:0; }
  .sw::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--dim); transition:left .15s; }
  .sw.on { background:#1f4b5a; } .sw.on::after { left:16px; background:var(--cyan); }
  .banner { display:flex; gap:10px; align-items:center; background:#2a2617; border:1px solid #5a4d2a; border-radius:10px; padding:8px 12px; margin-bottom:10px; font-size:13px; }
  .banner .t { flex:1; }
  .kbd { color:var(--dim); font-size:11px; }
</style>
</head>
<body>
<header>
  <b>Echo</b>
  <span class="dot" id="dot"></span><span class="st" id="status">…</span>
  <span class="sp"></span>
  <button class="btn" id="lvl" title="Lv 0：用中文写，看 You said。Lv 1：试着用英文写，看 Better（原生工程师会怎么说）">Lv 0</button>
  <button class="btn" id="power" title="暂停 / 恢复 Echo">开</button>
  <button class="btn ghost" id="pin" title="窗口置顶" hidden>置顶</button>
</header>
<nav>
  <button class="on" data-tab="feed">回声</button>
  <button data-tab="favs">收藏<span class="n" id="favcount"></span></button>
  <button data-tab="harness">Harness<span id="hz-warn" hidden class="warn"></span></button>
  <button data-tab="model">模型</button>
  <button data-tab="settings">设置</button>
</nav>
<main>
  <section id="feed">
    <div class="banner" id="onboard" hidden><div class="t">Echo 还没接到任何 agent。选好 harness，一键接入。</div><button class="btn pri" data-go="harness">去接入</button></div>
    <div class="now" id="now"><div class="empty">等你和 agent 说第一句话</div></div>
    <div id="today"></div>
  </section>
  <section id="favs" class="favs" hidden></section>
  <section id="harness" hidden></section>
  <section id="model" hidden></section>
  <section id="settings" hidden></section>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s);
const api = (m, p, b) => fetch(p, { method: m, headers: { "content-type": "application/json" }, body: b ? JSON.stringify(b) : undefined }).then((r) => r.json());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const desktop = window.echoDesktop || null;
const SRC = { "claude-code": "Claude Code", codex: "Codex", zcode: "ZCode", cursor: "Cursor", demo: "Demo", cli: "CLI" };
let favs = [], favWords = new Set(), favSentences = new Set(), state = { level: 0, enabled: true }, turns = [], setup = null, health = null;

function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  return s < 60 ? "刚刚" : s < 3600 ? `${Math.floor(s / 60)} 分钟前` : s < 86400 ? `${Math.floor(s / 3600)} 小时前` : `${Math.floor(s / 86400)} 天前`;
}

// ---- feed ----
function words(en) {
  return String(en ?? "").split(/(\s+)/).map((tok) => {
    if (!tok.trim()) return tok;
    const core = tok.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g, "");
    if (!core) return esc(tok);
    const on = favWords.has(core.toLowerCase()) ? " fav" : "";
    return tok.replace(core, `<span class="w${on}" data-w="${esc(core)}">${esc(core)}</span>`);
  }).join("");
}
function line(kind, en, status) {
  const label = kind === "better" ? "Better" : kind === "inShort" ? "In short" : "You said";
  const cls = kind === "better" ? "better" : kind === "inShort" ? "short" : "you";
  if (status && status !== "done") return `<div class="line"><span class="k ${cls}">▸ ${label}</span><span class="en pending">${status === "pending" ? "…" : "(unavailable)"}</span></div>`;
  const on = favSentences.has(en) ? " on" : "";
  return `<div class="line" data-s="${esc(en)}"><span class="k ${cls}">▸ ${label}</span><span class="en">${words(en)}</span><span class="star${on}" title="收藏这句">★</span></div>`;
}
function renderFeed() {
  const u = [...turns].reverse().find((t) => t.role === "user");
  const a = [...turns].reverse().find((t) => t.role === "agent");
  const now = $("#now");
  if (!u && !a) now.innerHTML = `<div class="empty">等你和 agent 说第一句话</div>`;
  else {
    const aFresh = a && (!u || a.ts >= u.ts);
    const last = aFresh ? a : u;
    now.innerHTML = (u ? line(u.kind || "youSaid", u.en, u.status) : "") + (aFresh ? line("inShort", a.en, a.status) : "")
      + (u ? `<div class="zh">${esc(u.text.slice(0, 140))}</div>` : "") + `<div class="meta">${esc(SRC[last.source] || last.source || "")} · ${ago(last.ts)}</div>`;
  }
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const todays = turns.filter((t) => new Date(t.ts) >= start && t.status === "done").reverse();
  $("#today").innerHTML = `<h2>今天 · ${todays.length} 条</h2>` + (todays.length ? todays.map((t) => `<div class="item">${line(t.role === "agent" ? "inShort" : (t.kind || "youSaid"), t.en, t.status)}<div class="zh">${esc(t.text.slice(0, 100))}</div></div>`).join("") : `<div class="empty">今天还没有</div>`);
  $("#favcount").textContent = favs.length || "";
  $("#favs").innerHTML = `<h2>收藏 · ${favs.length}</h2>` + (favs.length ? favs.map((f) => `<div class="f" data-kind="${f.kind}" data-text="${esc(f.text)}"><b>${esc(f.text)}</b><span class="ctx">${f.kind === "word" ? esc(f.context) : ""}</span><span class="x" title="取消收藏">×</span></div>`).join("") : `<div class="empty">点英文里的任何一个词，或句尾的 ★</div>`);
}
function renderHeader() {
  $("#lvl").textContent = `Lv ${state.level || 0}`; $("#lvl").classList.toggle("on", state.level === 1);
  const on = state.enabled !== false;
  $("#power").textContent = on ? "开" : "暂停中"; $("#power").classList.toggle("on", on);
  const dot = $("#dot");
  if (!health) { dot.className = "dot err"; $("#status").textContent = "core 不可用"; }
  else { dot.className = "dot " + (on ? "ok" : "off"); $("#status").textContent = health.model; }
  const anyHarness = setup?.harnesses.some((h) => h.enabled);
  $("#onboard").hidden = !setup || anyHarness || state.onboarded;
  $("#hz-warn").hidden = !setup || anyHarness;
}
function setFavs(list) { favs = list; favWords = new Set(list.filter((f) => f.kind === "word").map((f) => f.key)); favSentences = new Set(list.filter((f) => f.kind === "sentence").map((f) => f.text)); }

// ---- harness ----
let showSnippet = null, justEnabled = null;
function renderHarness() {
  if (!setup) return;
  $("#harness").innerHTML = `<p class="kbd" style="margin:4px 0 10px">接入 = 往该 harness 的用户级配置里写两条 hook（用 curl 把每轮对话发给本机的 Echo）。随时可移除；改动前会留一份 .echo-bak。</p>`
    + setup.harnesses.map((h) => {
      const seen = setup.lastSeen[h.id];
      const badge = h.enabled ? `<span class="badge on">已接入${seen ? " · " + ago(seen) + "收到" : ""}</span>` : h.present ? `<span class="badge warn">检测到，未接入</span>` : `<span class="badge">未检测到</span>`;
      return `<div class="card ${h.present || h.enabled ? "" : "off"}">
        <div class="hd"><div class="t"><b>${esc(h.label)}</b> <span class="kbd">${esc(h.sub)}</span><small>${esc(h.display)}</small></div>${badge}
          <button class="btn ${h.enabled ? "" : "pri"}" data-harness="${h.id}" data-enabled="${h.enabled ? 1 : 0}" ${h.present || h.enabled ? "" : "disabled"}>${h.enabled ? "移除" : "接入"}</button></div>
        ${h.enabled && (justEnabled === h.id || !seen) ? `<div class="after">下一步：${esc(h.after)}</div>` : ""}
        <div class="body"><code>${esc(h.file)}</code> · <a href="#" data-snippet="${h.id}" style="color:var(--dim)">${showSnippet === h.id ? "收起" : "看写入的内容"}</a>
        ${showSnippet === h.id ? `<pre id="snip-${h.id}">…</pre>` : ""}</div></div>`;
    }).join("");
  if (showSnippet) api("GET", `setup/snippet?id=${showSnippet}`).then((s) => { const el = $(`#snip-${showSnippet}`); if (el) el.textContent = JSON.stringify(s, null, 2); });
}

// ---- model ----
let modelType = null;
function renderModel() {
  if (!setup) return;
  const b = setup.backend; modelType ||= b.type;
  const opt = setup.backendOptions.find((o) => o.id === modelType) || setup.backendOptions[0];
  const cur = b.type === opt.id ? b : {};
  const f = (name, label, value, type = "text", ph = "") => `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value ?? "")}" placeholder="${esc(ph)}" spellcheck="false">`;
  let fields = "";
  if (opt.fields.includes("model")) fields += f("model", "模型", cur.model ?? opt.defaults.model, "text", opt.defaults.model || "留空用该工具的默认模型");
  if (opt.fields.includes("baseUrl")) fields += f("baseUrl", "Base URL", cur.baseUrl ?? opt.defaults.baseUrl);
  if (opt.fields.includes("apiKey")) fields += f("apiKey", "API Key", cur.apiKey ?? "", "password", "只存在本机，不上传");
  if (opt.fields.includes("name")) fields += f("name", "模型名", cur.name ?? opt.defaults.name);
  if (opt.fields.includes("extra")) fields += f("extra", "额外请求参数 JSON（留空按端点自动关闭思考）", typeof cur.extra === "string" ? cur.extra : cur.extra ? JSON.stringify(cur.extra) : "", "text", '{"thinking":{"type":"disabled"}}');
  $("#model").innerHTML = `<p class="kbd" style="margin:4px 0 10px">Echo 用一个便宜、快的模型做翻译和一句话概括，和你正在用的 agent 无关。选一个已登录的工具最省事。</p>`
    + setup.backendOptions.map((o) => `<div class="opt ${o.id === opt.id ? "sel" : ""} ${o.present ? "" : "dis"}" data-model="${o.id}"><span class="r"></span><div class="t"><b>${esc(o.label)}</b>${o.id === b.type && setup.fromConfig ? ' <span class="badge on">当前</span>' : ""}<small>${esc(o.sub)}${o.present ? "" : " · 本机未检测到"}</small></div></div>`).join("")
    + `<div class="card" id="bk" style="margin-top:10px">${opt.note ? `<div class="kbd">${esc(opt.note)}</div>` : ""}${fields}
      <div class="actions"><button class="btn" id="bk-test">测试一次</button><button class="btn pri" id="bk-save">保存并启用</button><span class="kbd">${setup.fromConfig ? "" : "当前用的是启动参数里的默认值"}</span></div>
      <div class="result" id="bk-result"></div></div>`;
}
function readForm() {
  const b = { type: modelType };
  for (const inp of $("#bk").querySelectorAll("input")) b[inp.name] = inp.value;
  return b;
}

// ---- settings ----
async function renderSettings() {
  const d = desktop ? await desktop.get() : null;
  const sw = (id, on) => `<button class="sw ${on ? "on" : ""}" data-sw="${id}" role="switch" aria-checked="${on}"></button>`;
  $("#settings").innerHTML = `
    <div class="row"><div class="t">强度 <small>Lv 0：你用中文写，Echo 给出英文版。Lv 1：你试着用英文写，Echo 给出原生工程师的说法。</small></div>
      <button class="btn ${state.level ? "" : "on"}" data-level="0">Lv 0</button><button class="btn ${state.level ? "on" : ""}" data-level="1">Lv 1</button></div>
    <div class="row"><div class="t">系统通知 <small>每轮结束弹一条两行通知；桌面版 harness 没有内联显示时靠它。</small></div>${sw("notify", state.notify ?? health?.notify ?? false)}</div>
    ${desktop ? `<div class="row"><div class="t">窗口置顶 <small>像状态栏一样一直浮在 agent 上面。</small></div>${sw("pin", d.alwaysOnTop)}</div>
    <div class="row"><div class="t">登录时启动 <small>Echo 不开，hook 就静默；开机自启才能一直有回声。</small></div>${sw("autostart", d.autostart)}</div>
    <div class="row"><div class="t">关闭窗口时 <small>收到托盘继续在后台工作（推荐）。</small></div>${sw("tray", d.closeToTray)}</div>` : ""}
    <div class="row"><div class="t">数据 <small>对话、译文、收藏都只在本机：<code>${esc(setup?.dataDir || "~/.echo")}</code></small></div>${desktop ? `<button class="btn" id="open-data">打开</button>` : ""}</div>
    <div class="row"><div class="t">Echo ${esc(setup?.version || "")} <small>本机 core：127.0.0.1:${setup?.port || 4319}${d ? " · Electron " + esc(d.versions.electron) : ""}</small></div>${desktop ? `<button class="btn ghost" id="quit">退出 Echo</button>` : ""}</div>`;
}

// ---- data ----
async function loadAll() {
  try {
    const [r, f, s, su, h] = await Promise.all([api("GET", "recent?n=100"), api("GET", "favorites"), api("GET", "state"), api("GET", "setup"), api("GET", "health")]);
    turns = r.turns.reverse(); setFavs(f.favorites); state = s; setup = su; health = h;
  } catch { health = null; }
  renderFeed(); renderHeader(); renderHarness(); renderModel(); renderSettings();
}
async function reloadSetup() { setup = await api("GET", "setup"); renderHarness(); renderModel(); renderHeader(); }

// ---- events ----
function show(tab) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  for (const id of ["feed", "favs", "harness", "model", "settings"]) $("#" + id).hidden = id !== tab;
  if (tab === "harness" || tab === "model") reloadSetup();
  if (tab === "settings") renderSettings();
}
document.addEventListener("click", async (e) => {
  const t = e.target;
  const nav = t.closest("nav button, [data-go]"); if (nav) return show(nav.dataset.tab || nav.dataset.go);
  const w = t.closest(".w");
  if (w) { const r = await api("POST", "favorites/toggle", { kind: "word", text: w.dataset.w, context: w.closest(".line")?.dataset.s || "" }); setFavs(r.favorites); return renderFeed(); }
  const st = t.closest(".star");
  if (st) { const r = await api("POST", "favorites/toggle", { kind: "sentence", text: st.closest(".line").dataset.s }); setFavs(r.favorites); return renderFeed(); }
  const x = t.closest(".favs .x");
  if (x) { const f = x.closest(".f"); const r = await api("POST", "favorites/toggle", { kind: f.dataset.kind, text: f.dataset.text }); setFavs(r.favorites); return renderFeed(); }
  const hz = t.closest("[data-harness]");
  if (hz) { hz.disabled = true; const on = hz.dataset.enabled !== "1"; const r = await api("POST", "setup/harness", { id: hz.dataset.harness, enabled: on }); if (r.error) alert(r.error); justEnabled = on ? hz.dataset.harness : null; if (on) api("POST", "state", { onboarded: true }).then((s) => (state = s)); return reloadSetup(); }
  const sn = t.closest("[data-snippet]");
  if (sn) { e.preventDefault(); showSnippet = showSnippet === sn.dataset.snippet ? null : sn.dataset.snippet; return renderHarness(); }
  const mo = t.closest(".opt[data-model]");
  if (mo && !mo.classList.contains("dis")) { modelType = mo.dataset.model; return renderModel(); }
  if (t.id === "bk-test") { const r = $("#bk-result"); r.textContent = "测试中…"; r.className = "result"; const out = await api("POST", "setup/backend", { backend: readForm(), test: true }); r.textContent = out.ok ? `${out.ms} ms · ${out.en}` : `失败（${out.ms} ms）：${out.error}`; r.className = "result " + (out.ok ? "ok" : "err"); return; }
  if (t.id === "bk-save") { const r = $("#bk-result"); const out = await api("POST", "setup/backend", { backend: readForm() }); r.textContent = out.error || "已保存，下一轮起生效"; r.className = "result " + (out.error ? "err" : "ok"); health = await api("GET", "health"); return reloadSetup(); }
  if (t.id === "lvl" || t.dataset.level !== undefined) { state = await api("POST", "state", { level: t.dataset.level !== undefined ? Number(t.dataset.level) : (state.level ? 0 : 1) }); renderHeader(); return renderSettings(); }
  if (t.id === "power") { state = await api("POST", "state", { enabled: state.enabled === false }); return renderHeader(); }
  if (t.id === "pin") { const d = await desktop.set({ alwaysOnTop: !(await desktop.get()).alwaysOnTop }); $("#pin").classList.toggle("on", d.alwaysOnTop); return; }
  const sw = t.closest("[data-sw]");
  if (sw) {
    const on = !sw.classList.contains("on");
    if (sw.dataset.sw === "notify") state = await api("POST", "state", { notify: on });
    else { const d = await desktop.set({ [sw.dataset.sw === "pin" ? "alwaysOnTop" : sw.dataset.sw === "autostart" ? "autostart" : "closeToTray"]: on }); $("#pin").classList.toggle("on", d.alwaysOnTop); }
    return renderSettings();
  }
  if (t.id === "open-data") return desktop.openPath(setup.dataDir);
  if (t.id === "quit") return desktop.quit();
});

// Live updates from the core.
function connect() {
  const es = new EventSource("events");
  es.addEventListener("turn", (e) => { const { turn } = JSON.parse(e.data); const i = turns.findIndex((t) => t.id === turn.id); if (i >= 0) turns[i] = turn; else turns.push(turn); renderFeed(); });
  es.onerror = () => { es.close(); health = null; renderHeader(); setTimeout(connect, 2000); };
  es.onopen = () => { if (!health) loadAll(); };
}
if (desktop) { $("#pin").hidden = false; if (desktop.platform === "darwin") document.body.classList.add("mac"); desktop.get().then((d) => $("#pin").classList.toggle("on", d.alwaysOnTop)); }
loadAll(); connect();
setInterval(() => { if (!$("#harness").hidden) reloadSetup(); }, 15000);
</script>
